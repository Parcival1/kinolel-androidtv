# KinoLel TV (Android TV / Google TV) – Marke. EINZIGE Stelle für Name, Server, Kennung und Version.
# APPLICATION_ID nie ändern (sonst neue App statt Update). Andere KinoLel-Apps: de.kinolel.app (Handy), Jellyfin: org.jellyfin.androidtv.
APP_NAME=KinoLel
SERVER_URL=https://kinolel.de
APPLICATION_ID=de.kinolel.tv
# Version (drei Zahlen). Bei jeder Verteilung erhöhen; Tag v<Version> erzeugt ein Release unter GitHub-Releases.
VERSION=0.1.3
# Update-Prüfung bei jedem Start: Liste der aktuellen App-Versionen auf kinolel.de und Schlüssel dieser App darin
APPS_LISTE=https://kinolel.de/web/kinolel/apps.json
APPS_SCHLUESSEL=androidtv
# Rückfall, wenn die Liste nicht erreichbar ist: neuestes Release dieses GitHub-Repos
UPDATE_REPO=Parcival1/kinolel-androidtv
# Wünsche (Seerr) und Hilfe als QR-Code; ungarische Nutzer bekommen das ungarische Wunschportal
WUENSCHE_URL=https://wuensche.kinolel.de
WUENSCHE_URL_HU=https://kivansagok.kinolel.de
HILFE_URL=https://kinolel.de/web/#/home?tab=4
